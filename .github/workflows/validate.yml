name: WISE source validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: wise-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Supergent--main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Supergent--main/requirements.txt
      - name: Install runtime and test dependencies
        # Include library-only desktop fixtures on Linux as well. No native
        # renderer, model, browser download or account is started here.
        run: python -m pip install -r requirements.txt pytest==9.1.1 pytest-cov pytest-asyncio hypothesis==6.168.3 pywebview==6.2.1 stix2==3.0.2 duckdb==1.5.6
      - name: Non-interactive regression (not native or account acceptance)
        run: python -m qa.acceptance.source_regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ matrix.os }}
          path: Supergent--main/qa-results/ci.xml
          if-no-files-found: warn
