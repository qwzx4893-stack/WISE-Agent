<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="420" viewBox="0 0 1260 420" role="img" aria-labelledby="title desc">
  <title id="title">WISE Agent OS</title>
  <desc id="desc">A local-first Agent OS for your desktop. Conversation, cognition and coordinated execution, connected through a capability network.</desc>
